    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/app.css" media="print" onload="this.onload=null;this.removeAttribute('media');">
    <title>QFZ Login Page </title>
  </head>
  <body class="bg-grey1">
    <div class="login-wrapper">
      <div class="radius-32 bg-grey3 container-lg p-0 login-holder">

          <div class="col-lg-6"> 
            <div class="login-box gy-32 d-flex flex-column">
              <div class="d-flex"><img class="img-fluid" src="assets/images/logo-black.svg"></div>

              <button class="btn btn-white text-black1 fw-500 fs-18 p-2 p-lg-3 rounded-pill align-items-center d-flex justify-content-center gx-12" type="submit"> <i class="size-24 d-inline-block" style="background-image:url(assets/images/microsoft-logo.svg);background-repeat: no-repeat"></i><span>Sign in with Microsoft</span></button>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="login-section-end login-base-image h-100"><img class="img-fluid w-100 h-100" src="assets/images/loginpage-image6.jpg" alt="Slide 4"><img class="login-top-image" src="assets/images/logo-white.svg"></div>

        </div>
      </div>
    </div>
